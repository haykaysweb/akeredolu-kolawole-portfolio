<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akeredolu Kolawole | Full-Stack Web Developer</title>
    <meta
      name="description"
      content="Portfolio of a Full-Stack Web Developer specializing in React, TypeScript, Node.js, Express and MongoDB."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("portfolio-settings") || "{}");
        if (s.theme)
          document.documentElement.setAttribute("data-theme", s.theme);
        if (s.accentColor)
          document.documentElement.style.setProperty(
            "--c-accent",
            s.accentColor,
          );
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
